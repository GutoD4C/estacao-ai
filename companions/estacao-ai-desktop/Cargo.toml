[workspace]

[package]
name = "estacao-ai-desktop"
version = "1.7.7"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Aplicativo desktop nativo (Tauri v2) da Estação I.A — janela própria sem navegador externo"
license = "MIT"

[lib]
name = "ai_memory_desktop"
path = "src/lib.rs"

[[bin]]
name = "estacao-ai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1"
serde_json = "1"
tauri = { version = "2.12", features = [] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
