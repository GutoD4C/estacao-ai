name: windows-installer

on:
  push:
    tags:
      - 'estacao-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release para anexar o instalador Windows (ex.: estacao-1.7.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-installer:
    name: Build & Publish Windows Installer (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/estacao-') }}

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $inno = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $inno)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup 6" }
          }

      - name: Build Windows binary and Inno Setup installer
        shell: pwsh
        run: |
          & ./scripts/package-windows.ps1
          $setup = Resolve-Path target/packages/Estacao-ai-Setup-win10-11-x64.exe
          $standalone = Resolve-Path target/packages/Estacao-ai-win10-11-x64.exe
          Get-Item $setup, $standalone | Format-Table Name, Length

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Resolve-Path target/packages/Estacao-ai-Setup-win10-11-x64.exe
          $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Instalador retornou código $($proc.ExitCode)" }
          $expected = Join-Path $env:LOCALAPPDATA 'Programs\estacao-ai\estacao-ai.exe'
          if (-not (Test-Path -LiteralPath $expected)) {
            throw "Executável não encontrado após instalação: $expected"
          }
          $ver = & $expected --version
          if ($LASTEXITCODE -ne 0) { throw "Falha ao executar estacao-ai.exe --version" }
          Write-Host "Instalador verificado com sucesso: $ver"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estacao-ai-windows-x64
          path: |
            target/packages/Estacao-ai-Setup-win10-11-x64.exe
            target/packages/Estacao-ai-win10-11-x64.exe

  build-linux-deb:
    name: Build Linux Package (.deb amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/estacao-') }}

      - name: Build .deb package
        run: bash ./scripts/package-deb.sh

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estacao-ai-linux-deb
          path: target/packages/estacao-ai_*.deb

  publish-release:
    name: Publish Estação I.A Release & SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build-windows-installer, build-linux-deb]
    if: startsWith(github.ref, 'refs/tags/estacao-') || inputs.release_tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: estacao-ai-windows-x64
          path: dist

      - name: Download Linux .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: estacao-ai-linux-deb
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#estacao-}"
          cd dist
          sha256sum Estacao-ai-Setup-win10-11-x64.exe Estacao-ai-win10-11-x64.exe estacao-ai_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes_file="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_sec = 1; next }
            /^## \[/ && in_sec { exit }
            in_sec { print }
          ' ../CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'Estação I.A %s\n' "$version" > "$notes_file"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Estação I.A $version" --notes-file "$notes_file" --latest
          fi
          gh release upload "$tag" Estacao-ai-Setup-win10-11-x64.exe Estacao-ai-win10-11-x64.exe estacao-ai_*.deb SHA256SUMS.txt --clobber
